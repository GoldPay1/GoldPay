<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Pay - Mine Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b111e; color: #ffffff; padding: 15px 15px 100px 15px; }
        
        /* यूजर प्रोफाइल कार्ड */
        .profile-card { background: linear-gradient(135deg, #16223f 0%, #0f172a 100%); border: 1px solid #1e293b; border-radius: 15px; padding: 25px 20px 20px 20px; text-align: center; margin-bottom: 15px; position: relative; }
        
        /* PREMIUM NEON AVATAR DESIGN */
        .avatar-container { display: flex; justify-content: center; align-items: center; margin-bottom: 12px; position: relative; }
        .premium-avatar { width: 85px; height: 85px; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); border: 2px solid #00ffcc; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(0, 255, 204, 0.15); position: relative; }
        .premium-avatar svg { width: 42px; height: 42px; fill: #00ffcc; filter: drop-shadow(0 0 4px rgba(0, 255, 204, 0.5)); }
        .vip-tag { position: absolute; bottom: -5px; background: linear-gradient(90deg, #00ffcc, #00b3ff); color: #0b111e; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; box-shadow: 0 2px 8px rgba(0, 255, 204, 0.4); border: 1px solid #0b111e; }
        
        .profile-card h3 { font-size: 18px; color: #ffffff; margin-bottom: 5px; font-weight: 600; }
        .profile-card p { font-size: 12px; color: #8fa0bc; background: rgba(30, 41, 59, 0.5); display: inline-block; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-top: 4px; }

        /* टोटल डिपॉजिट और विड्रॉ सेक्शन */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stats-box { background: #141d30; border: 1px solid #1e293b; border-radius: 12px; padding: 15px 10px; text-align: center; }
        .stats-box span { font-size: 11px; color: #8fa0bc; display: block; margin-bottom: 5px; }
        .stats-box h2 { font-size: 18px; font-weight: bold; }
        .deposit-amount { color: #00ffcc; } 
        .withdraw-amount { color: #ff4d4d; } 

        /* सेटिंग्स/मेन्यू लिस्ट */
        .menu-list { background: #141d30; border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #1e293b; cursor: pointer; text-decoration: none; color: #ffffff; transition: background 0.2s; }
        .menu-item:active { background: #1e293b; }
        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 14px; }
        
        /* PREMIUM MENU ICONS (SVG) */
        .menu-svg { width: 18px; height: 18px; fill: #8fa0bc; display: block; }
        .menu-item:hover .menu-svg, .menu-item:active .menu-svg { fill: #00ffcc; }
        .logout-item .menu-svg { fill: #ff4d4d !important; }
        .logout-item .menu-title { color: #ff4d4d; font-weight: bold; }
        
        .menu-title { font-size: 14px; color: #cbd5e1; }
        .arrow-right { color: #475569; font-size: 14px; font-weight: bold; }

        /* FIXED BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background-color: #111827; border-top: 2px solid #1e293b; display: flex; justify-content: space-around; padding: 12px 0; z-index: 9999; }
        .nav-item { background: none; border: none; color: #8fa0bc; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 20%; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #00ffcc; font-weight: bold; }
        .nav-svg { width: 20px; height: 20px; fill: #8fa0bc; display: block; }
        .nav-item.active .nav-svg { fill: #00ffcc; filter: drop-shadow(0 0 3px rgba(0, 255, 204, 0.4)); }

        /* PREMIUM GLASSMORPHIC POP-UP STYLE */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }
        .popup-box {
            background: linear-gradient(145deg, rgba(22, 34, 56, 0.96), rgba(11, 18, 30, 0.98));
            border: 1px solid rgba(255, 77, 77, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 77, 77, 0.15);
            padding: 30px 22px;
            border-radius: 24px;
            width: 100%;
            max-width: 330px;
            text-align: center;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-icon-circle {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: rgba(255, 77, 77, 0.12);
            border: 2px solid rgba(255, 77, 77, 0.45);
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .popup-text {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 26px;
            line-height: 1.5;
        }
        .popup-btn-group {
            display: flex;
            gap: 12px;
        }
        .btn-cancel {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-confirm {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #ff4d4d, #e60000);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 77, 77, 0.35);
        }
        .btn-cancel:active, .btn-confirm:active {
            transform: scale(0.96);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- प्रोफाइल कार्ड सेक्शन -->
    <div class="profile-card">
        <div class="avatar-container" id="secret-trigger-btn">
            <div class="premium-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <div class="vip-tag">VIP 1</div>
            </div>
        </div>
        <h3 id="display-id">ID: Gold_user786</h3>
        <p id="display-invite">Invite Code: 559110</p>
    </div>

    <!-- टोटल डिपॉजिट और विड्रॉ सेक्शन -->
    <div class="stats-grid">
        <div class="stats-box">
            <span>Total Deposit (कुल जमा)</span>
            <h2 class="deposit-amount" id="ui-deposit">₹0.00</h2>
        </div>
        <div class="stats-box">
            <span>Total Withdraw (कुल निकासी)</span>
            <h2 class="withdraw-amount" id="ui-withdraw">₹0.00</h2>
        </div>
    </div>

    <!-- मेन्यू ऑप्शंस की लिस्ट -->
    <div class="menu-list">
        <a href="transactions.html" class="menu-item">
            <div class="menu-left">
                <svg class="menu-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm-4 8H7v-2h6v2z"/></svg>
                <span class="menu-title">Transaction History</span>
            </div>
            <span class="arrow-right">➔</span>
        </a>

        <div class="menu-item" onclick="changePassword()">
            <div class="menu-left">
                <svg class="menu-svg" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <span class="menu-title">Change Password</span>
            </div>
            <span class="arrow-right">➔</span>
        </div>

        <a href="tg://resolve?domain=gold_pay0001" class="menu-item">
            <div class="menu-left">
                <svg class="menu-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
                <span class="menu-title">Customer Support</span>
            </div>
            <span class="arrow-right">➔</span>
        </a>

        <div class="menu-item logout-item" onclick="openLogoutPopup()">
            <div class="menu-left">
                <svg class="menu-svg" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                <span class="menu-title">Logout</span>
         </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="plan.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            <span>Plan</span>
        </a>
        <a href="team.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Team</span>
        </a>
        <a href="mine.html" class="nav-item active">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Mine</span>
        </a>
    </div>

    <div id="custom-popup" class="popup-overlay">
        <div class="popup-box">
            <div class="popup-icon-circle">
                <svg viewBox="0 0 24 24" width="34" height="34" style="filter: drop-shadow(0 0 8px rgba(255, 77, 77, 0.6));">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="#ff4d4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="popup-title">Logout</div>
            <div class="popup-text">क्या आप सच में लॉगआउट करना चाहते हैं?</div>
            <div class="popup-btn-group">
                <button class="btn-cancel" onclick="closeLogoutPopup()">Cancel</button>
                <button class="btn-confirm" onclick="confirmLogout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            var savedPhone = localStorage.getItem("saved_phone");
            if (savedPhone) {
                document.getElementById("display-id").innerText = "ID: " + savedPhone;
            }
            var totalDep = localStorage.getItem("total_deposit") || "0.00";
            var totalWith = localStorage.getItem("total_withdraw") || "0.00";
            document.getElementById("ui-deposit").innerText = "₹" + parseFloat(totalDep).toFixed(2);
            document.getElementById("ui-withdraw").innerText = "₹" + parseFloat(totalWith).toFixed(2);
        };

        function openLogoutPopup() {
            document.getElementById("custom-popup").style.display = "flex";
        }

        function closeLogoutPopup() {
            document.getElementById("custom-popup").style.display = "none";
        }

        function confirmLogout() {
            window.location.href = "index.html";
        }

        function changePassword() {
            var newPass = prompt("Enter New Password:");
            if (newPass && newPass.trim() !== "") {
                localStorage.setItem("saved_pass", newPass.trim());
                alert("Password Updated Successfully!");
            }
        }
    </script>
</body>
</html>
