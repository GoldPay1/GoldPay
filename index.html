<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhan Pay - Investment Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', Arial, sans-serif; }
        body { background: #0b151e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); backdrop-filter: blur(10px); text-align: center; position: relative; }
        .brand-title { color: #00e5ff; font-size: 28px; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
        .brand-sub { color: #8a99a8; font-size: 14px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { color: #00e5ff; font-size: 13px; display: block; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00e5ff; background: rgba(255, 255, 255, 0.08); }
        input::placeholder { color: #4e5d6c; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%); border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); }
        .btn-submit:active { transform: scale(0.98); }
        .footer-text { color: #8a99a8; font-size: 13px; margin-top: 25px; }
        .footer-text span { color: #00e5ff; cursor: pointer; font-weight: 500; text-decoration: underline; }
        
        .hidden { display: none; }

        /* PREMIUM GLASSMORPHIC POP-UP STYLE */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .popup-box {
            background: linear-gradient(145deg, rgba(22, 34, 56, 0.96), rgba(11, 21, 35, 0.98));
            border: 1px solid rgba(0, 229, 255, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(0, 229, 255, 0.15);
            padding: 32px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 330px;
            text-align: center;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-icon-circle {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .popup-icon-circle.success {
            background: rgba(0, 255, 170, 0.1);
            border: 2px solid rgba(0, 255, 170, 0.45);
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.25);
        }
        .popup-icon-circle.error {
            background: rgba(255, 77, 77, 0.12);
            border: 2px solid rgba(255, 77, 77, 0.45);
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.25);
        }
        .popup-title {
            font-size: 23px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .popup-text {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 26px;
        }
        .popup-btn {
            background: linear-gradient(90deg, #00e5ff, #00b4d8);
            color: #050b14;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .popup-btn:active {
            transform: scale(0.97);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-title">DHAN PAY</div>
        <div class="brand-sub">Your Investment Platform</div>

        <!-- 1. REGISTRATION FORM -->
        <div id="register-form">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="reg-phone" placeholder="+91 Enter Number">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-pass" placeholder="Enter Password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="reg-confirm" placeholder="Confirm Password">
            </div>
            <div class="form-group">
                <label>Invite Code (Optional)</label>
                <input type="text" id="reg-invite" placeholder="Enter Invite Code">
            </div>
            <button class="btn-submit" onclick="handleRegistration()">Create Account</button>
            <div class="footer-text">
                Already have an account? <span onclick="toggleForm('login')">Login</span>
            </div>
        </div>

        <!-- 2. LOGIN FORM -->
        <div id="login-form" class="hidden">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="login-phone" placeholder="+91 Enter Number">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter Password">
            </div>
            <button class="btn-submit" onclick="handleLogin()">Sign In</button>
            <div class="footer-text">
                Don't have an account? <span onclick="toggleForm('register')">Register</span>
            </div>
        </div>
    </div>

    <!-- PREMIUM POP-UP HTML -->
    <div id="custom-popup" class="popup-overlay">
        <div class="popup-box" id="popup-card">
            <div id="p-icon-circle" class="popup-icon-circle success">
                <!-- SVG icon dynamically injected by JS -->
            </div>
            <div id="p-title" class="popup-title">Success!</div>
            <div id="p-text" class="popup-text">Account Created Successfully!</div>
            <button class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        var nextStep = null;

        function goToDashboard() {
            window.location.href = "dashboard.html";
        }

        // Premium Pop-up Trigger Function
        function showPopup(title, text, icon, type, callback) {
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-text').innerText = text;
            
            var iconCircle = document.getElementById('p-icon-circle');
            var card = document.getElementById('popup-card');
            var btn = document.querySelector('.popup-btn');

            if (type === 'error') {
                iconCircle.className = 'popup-icon-circle error';
                iconCircle.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" style="filter: drop-shadow(0 0 6px rgba(255,77,77,0.6));"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/></svg>';
                card.style.borderColor = 'rgba(255, 77, 77, 0.35)';
                card.style.boxShadow = '0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 77, 77, 0.15)';
                btn.style.background = 'linear-gradient(90deg, #ff4d4d, #ff1a1a)';
                btn.style.boxShadow = '0 6px 20px rgba(255, 77, 77, 0.35)';
                btn.style.color = '#ffffff';
            } else {
                iconCircle.className = 'popup-icon-circle success';
                iconCircle.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" style="filter: drop-shadow(0 0 6px rgba(0,255,170,0.6));"><path d="M5 13l4 4L19 7" fill="none" stroke="#00ffaa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                card.style.borderColor = 'rgba(0, 229, 255, 0.35)';
                card.style.boxShadow = '0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(0, 229, 255, 0.15)';
                btn.style.background = 'linear-gradient(90deg, #00e5ff, #00b4d8)';
                btn.style.boxShadow = '0 6px 20px rgba(0, 229, 255, 0.35)';
                btn.style.color = '#050b14';
            }
            
            document.getElementById('custom-popup').style.display = 'flex';
            nextStep = callback;
        }

        function closePopup() {
            document.getElementById('custom-popup').style.display = 'none';
            if (nextStep) {
                nextStep();
                nextStep = null;
            }
        }

        // Form badalne ka function
        function toggleForm(formType) {
            if (formType === 'login') {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            }
        }

        // Registration Logic
        function handleRegistration() {
            var phone = document.getElementById("reg-phone").value;
            var pass = document.getElementById("reg-pass").value;
            var confirm = document.getElementById("reg-confirm").value;

            if (phone === "" || pass === "" || confirm === "") {
                showPopup('Error!', 'Please Fill All Blanks!', '❌', 'error', null);
                return;
            }
            if (pass !== confirm) {
                showPopup('Error!', "Password doesn't match!", '❌', 'error', null);
                return;
            }

            localStorage.setItem("saved_phone", phone);
            localStorage.setItem("saved_pass", pass);
            
            showPopup('Success!', 'Account Created Successfully!', '✔️', 'success', function() {
                goToDashboard();
            });
        }

        // Login Logic
        function handleLogin() {
            var phone = document.getElementById("login-phone").value;
            var pass = document.getElementById("login-pass").value;

            var savedPhone = localStorage.getItem("saved_phone");
            var savedPass = localStorage.getItem("saved_pass");

            if (phone === "" || pass === "") {
                showPopup('Error!', 'Please Fill Phone And Password!', '❌', 'error', null);
                return;
            }
            if (phone === savedPhone && pass === savedPass) {
                showPopup('Success!', 'Login Successful!', '✔️', 'success', function() {
                    goToDashboard();
                });
            } else {
                showPopup('Error!', 'Invalid Phone Number or Password!', '❌', 'error', null);
            }
        }
    </script>
</body>
</html>
